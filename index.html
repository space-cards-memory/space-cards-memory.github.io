}
function latinDigits(t){ return String(t || "").replace(/[\u0660-\u0669]/g, d => d.charCodeAt(0) - 0x0660).replace(/[\u06F0-\u06F9]/g, d => d.charCodeAt(0) - 0x06F0).replace(/\u066A/g, "%").replace(/[\u066B\u066C]/g, ""); }
function numWords(text){
  const t = latinDigits(text);
  const num = "(\\d{1,3}(?:[ .\\u00a0\\u202f]\\d{3})+|\\d{1,6})";
  const toN = x => +x.replace(/[ .\u00a0\u202f]/g, "");
  let m = new RegExp("^\\s*" + num + "\\s*(%?)\\s*$").exec(t);
  if (m){ const n = toN(m[1]); if (n <= 999999) return enWords(n) + (m[2] ? " percent" : ""); }
  /* ordinals: 1er 1re 1ère 2e 2ème 2nd (fr) · 1st 2nd 3rd 4th (en) · 1. (de) · 1º 1ª 1.º 1° (es, it, pt) */
  m = /^\s*(\d{1,4})\s*(ère|ere|er|re|ème|eme|e|nde|nd|st|rd|th|\.º|\.ª|º|ª|°|\.)\s*$/i.exec(t);

async function slimBlob(b){

    const im = await decodeImage(b, 900), cv = toCanvas(im, 0, 0, srcW(im), srcH(im), 900); im.close && im.close();
    let out = await new Promise(r => cv.toBlob(r, "image/jpeg", 0.78));
    if (out && out.size > 150 * 1024) out = await new Promise(r => cv.toBlob(r, "image/jpeg", 0.65));
    return out && out.size < b.size ? out : b;
  } catch(e){ return b; }
}
let slimRunning = false;

/* ---------- Learning by groups: a few new words at a time, looped until known; the next group waits until this one holds ----------
   c.gq = the group (time it was opened), c.gs = loop stage (1 recognise, 2 find, 3 recall), c.gok = group passed.
   Once the loop is won a word enters the normal spaced-repetition scale (10 min, 1 h, 1 d…). */
const GRP_DEF = {on: true, size: 5, pace: "bal"};
/* pace: chain = next group at once; bal = after the 10-min review; solid = after the 1-hour review */
const PACE_P = {chain: 1, bal: 2, solid: 3};
function grp(){
  const g = Object.assign({}, GRP_DEF, S.settings.grp || {});
  if (!PACE_P[g.pace]) g.pace = g.unlock === "loop" ? "chain" : g.unlock === "1d" ? "solid" : "bal";
  return g;
}
/* new words are learned only through the learning loop, never mixed into reviews */
function grpOn(){ return true; }
function grpCards(){ return S.cards.filter(c => c.gq && !c.gok && (c.t[TK()] || "").trim()); }
function grpCardOk(c){ const st = c.s && c.s[TK()]; return !!(c.intro && st && st.p >= PACE_P[grp().pace]); }
function grpNum(){ return new Set(S.cards.filter(c => c.gq).map(c => c.gq)).size; }
function grpState(now){
  const g = grp(); let cur = grpCards();
  if (cur.length && cur.every(grpCardOk)){ cur.forEach(c => c.gok = true); cur = []; }
  const today = dayLog(now).groups || 0, num = grpNum();
  if (cur.length) return {cur, num, toLoop: cur.filter(c => !c.intro), ok: cur.filter(grpCardOk).length, today, canOpen: false, stock: 0};
  const stock = S.cards.filter(c => isNew(c) && !c.gq).length;
  return {cur, num, toLoop: [], ok: 0, today, stock, canOpen: stock > 0 && cStatus() === "active" && budgetLeft(now) > 0};
}
function grpNewNow(now){ const st = grpState(now); return st.cur.length ? st.toLoop.length : (st.canOpen ? Math.min(grp().size, st.stock) : 0); }
function grpOpen(now){
  const pick = S.cards.filter(c => isNew(c) && !c.gq).sort((a, b) => (b.relearn ? 1 : 0) - (a.relearn ? 1 : 0) || a.created - b.created).slice(0, grp().size);
  pick.forEach(c => { c.gq = now; c.gs = 1; });
  if (pick.length){ const log = dayLog(now); log.groups = (log.groups || 0) + 1; }
  return pick;
}
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function grpStart(now, open){
  if (!grpOn()) return false;
  const st = grpState(now);
  let ids = st.toLoop.map(c => c.id);
  if (!ids.length && (open || st.canOpen) && !st.cur.length) ids = grpOpen(now).map(c => c.id);
  if (!ids.length) return false;
  const all = S.cards.filter(c => c.gq === card(ids[0]).gq).map(c => c.id);
  sess.grp = {ids, all, num: grpNum(), phase: "see", i: 0, q: shuffle(ids), cur: null};
  sess.undo = null; save();
  return true;
}
function grpActive(){ return !!(sess && sess.grp && sess.grp.phase !== "done"); }
function whenText(){ return T({chain: "wLoop", bal: "w10m", solid: "w1h"}[grp().pace]); }
function grpHomeLine(now){
  const st = grpState(now), g = grp();
  if (st.cur.length){
    if (st.toLoop.length) return T("gHomeSee", st.num, st.toLoop.length);
    return T("gHomeWait", st.num, st.ok, st.cur.length, whenText());
  }
  if (!st.stock) return T("stockEmpty");

/* answer choices: the group's words, topped up with other words of the course */
function grpOptions(c, stage){
  /* a subject: the question stays, the answers are chosen; stage 1 uses the card's own traps when it has some */
  const subj = isSubj(), tgt = subj || stage === 2, val = x => tgt ? (x.t[TK()] || "") : x.fr;
  const seen = new Set([norm(val(c))]), out = [val(c)];
  const addV = v => { const n = norm(v); if (v && v.trim() && !seen.has(n)){ seen.add(n); out.push(v); } };

  if (subj && c.bad && c.bad.length && stage === 1) c.bad.forEach(addV);
  shuffle(sess.grp.all.map(card).filter(Boolean)).forEach(x => { if (out.length < 5) add(x); });
  if (subj && c.bad) c.bad.forEach(v => { if (out.length < 4) addV(v); });
  if (out.length < 4) shuffle(S.cards.filter(x => x.intro || x.gq)).forEach(x => { if (out.length < 4) add(x); });

function levelCounts(cards, k){
  const out = [0, 0, 0, 0, 0];
  (cards || []).forEach(c => { const st = c.s && c.s[k]; if (c.intro && st) out[levelOf(st.p)]++; else if (!c.intro && (c.t[k] || "").trim()) out[0]++; });

}

function grpRevLeft(){ const now = Date.now(); return S.cards.filter(c => dueLangs(c, now).length).length; }
function contRev(){
  const now = Date.now();
  if (!sess.queue.length) sess.queue = buildQueue(now, [], false, 0, "");
  sess.ended = false; sess.reason = ""; sess.countedAt = now; sess.cheer = null;

/* ---------- Subjects (bridge, grammar…): "+ Subject" next to "+ Language" ---------- */
function renderSubject(){
  const opts = LANGS_ALL.map(l => `<option value="${l[0]}" ${l[0] === SK() ? "selected" : ""}>${esc(langName(l[0]))}</option>`).join("");
  app.innerHTML = `<button class="btn ghost" data-go="home" style="align-self:flex-start">${T("backHome")}</button>
    <header class="stack" style="gap:6px"><h1>📚 ${T("subjTitle")}</h1><p class="muted">${T("subjHelp")}</p></header>
    <div class="field"><label for="sj-name">${T("subjName")}</label><input type="text" id="sj-name" placeholder="${T("subjEx")}"></div>
    <div class="field"><label for="sj-voice">${T("subjVoice")}</label><select id="sj-voice">${opts}</select></div>
    <p class="muted small">${T("subjVoiceHelp")}</p>
    <button class="btn block big" data-act="createSubject">${T("subjCreate")}</button>`;
}
function createSubject(){
  const name = (document.getElementById("sj-name").value || "").trim(); if (!name) return toast(T("subjNeedName"));
  const voice = document.getElementById("sj-voice").value || SK();
  const code = "s_" + (norm(name).replace(/[^a-z0-9]+/g, "") || uid()).slice(0, 12);
  const ex = courseOf(SK(), code); if (ex){ switchCourse(ex.id); save(); return go("home"); }
  const c = newCourse(S.settings.source, {code, name, subject: true, voice});
  c.autoSync = false; c.set.revDir = "fw"; S.settings.revDir = "fw";
  save(); toast(T("subjMade", name)); go("home");
}
let lastField = null;
document.addEventListener("focusin", e => { if (e.target.matches && e.target.matches("input[type=text], textarea, input:not([type])")) lastField = e.target; });
function subjTools(){
  return `<div class="insbar" role="group" aria-label="${T("insLbl")}">${["♠","♥","♦","♣"].map(x => `<button type="button" data-act="ins" data-sym="${x}" class="${x === "♥" || x === "♦" ? "suitr" : ""}">${x}\uFE0E</button>`).join("")}</div>
    <p class="muted small">${T("clozeHelp")}</p>`;
}
function insertSym(sym){
  const el = lastField && document.body.contains(lastField) ? lastField : document.getElementById("x-eu") || document.getElementById("f-fr"); if (!el) return;
  const a = el.selectionStart ?? el.value.length, b = el.selectionEnd ?? a;

}

/* ---------- Load: each subject Active / Upkeep / Paused, a daily budget of new items, today's load ---------- */
function cStatus(c){ c = c === undefined ? activeCourse() : c; return MULTI && c && c.status || "active"; }
function budgetUsed(now){
  const k = dayKey(now); let n = 0;
  ((S.courses && S.courses.length) ? S.courses : [{id: S.active}]).forEach(c => { const l = (c.id === S.active ? S.log : c.log || {})[k]; if (l) n += l.newCount || 0; });
  return n;
}
function budgetLeft(now){ const b = S.budget || 0; return b ? Math.max(0, b - budgetUsed(now)) : Infinity; }
function notifCourse(){
  if (cStatus(courseById(S.primary)) !== "pause") return S.primary;
  const c = (S.courses || []).find(x => cStatus(x) !== "pause"); return c ? c.id : S.primary;
}
function statusSwitch(){
  if (!MULTI || !S.courses || S.courses.length < 2) return "";
  const st = cStatus(), b = (k, ic) => `<button data-cstatus="${k}" aria-pressed="${st === k}">${ic} ${T("st_" + k)}</button>`;
  return `<div class="stack" style="gap:6px"><div class="seg" role="group" aria-label="${T("stLbl")}">${b("active", "▶")}${b("maint", "🛠")}${b("pause", "⏸\uFE0F")}</div>
    <p class="muted small" style="margin:0">${T("stHelp_" + st)}</p></div>`;
}
function loadLine(){
  const now = Date.now(), end = midnight(now) + D;
  let due = 0, neu = 0;
  ((S.courses && S.courses.length) ? S.courses : [{id: S.active}]).forEach(c => { if (cStatus(c) === "pause") return; const w = courseWork(c.id, end); due += w.due; neu += withCourse(c.id, () => cStatus() === "active" ? grpNewNow(now) : 0); });
  neu = Math.min(neu, budgetLeft(now));
  const min = Math.max(1, Math.round((due * 8 + neu * 30) / 60));
  const bud = S.budget ? `<p class="small muted" style="margin:0">${T("budgetLine", budgetUsed(now), S.budget)}</p>` : "";
  return `<section class="loadbox stack" style="gap:4px"><p style="margin:0">📅 ${due + neu ? T("loadToday", due, neu, min) : T("loadNone")}</p>${bud}</section>`;
}
function budgetSettings(){
  const b = S.budget || 0;
  return fold("set-budget", "📊 " + T("budgetTitle"), `<p class="muted small">${T("budgetHelp")}</p>
    <div class="field"><label for="bud">${T("budgetLbl")}</label><select id="bud">${[0,5,10,15,20,25,30,40,50].map(n => `<option value="${n}" ${n === b ? "selected" : ""}>${n || T("noLimit")}</option>`).join("")}</select></div>
    <button class="btn secondary" data-act="saveBudget">${T("save")}</button>`);
}

/* ---------- Words that keep slipping away: back to learning ---------- */
/* c.h keeps the last 5 results (1 right, 0 wrong); 3 misses or more = a hard word */
function isHard(c){ return !!(c.intro && c.h && (c.h.match(/0/g) || []).length >= 3); }
function noteResult(c, ok){ c.h = ((c.h || "") + (ok ? "1" : "0")).slice(-5); }
function relearn(c){
  if (!c) return;
  c.intro = 0; c.s = {}; c.h = ""; c.relearn = 1; c.lastOk = undefined;
  delete c.gq; delete c.gok; delete c.gs;
}
function relearnIds(ids){
  let n = 0; ids.forEach(id => { const c = card(id); if (c && c.intro){ relearn(c); n++; } });
  if (sess){ sess.queue = (sess.queue || []).filter(id => !ids.includes(id)); sess.pending = (sess.pending || []).filter(id => !ids.includes(id)); }
  return n;
}
function relearnCur(){
  const id = sess.cur; relearnIds([id]); sess.cur = null; sess.undo = null; save();
  toast(T("relearnOne")); nextCard();
}

/* end of a group: another one now, or when it comes */
function grpAfterBlock(){ return qWords(grpAfterBlock0()); }
function grpAfterBlock0(){
  const now = Date.now(), st = grpState(now), g = grp();
  if (st.canOpen) return `<button class="btn block big" data-act="nextGrp">${T("gMore", Math.min(g.size, st.stock))}</button>`;
  if (st.cur.length && !st.toLoop.length) return `<p class="info">${T("gHomeWait", st.num, st.ok, st.cur.length, whenText())}</p>`;
  return "";
}

/* ---------- My time slots in my calendar: on an iPhone, iPad or computer, the calendar rings at each session
   (a page cannot ring by itself once closed). Weekly events with an alert, nothing sent anywhere. ---------- */
/* only on Apple devices (iPhone, iPad, Mac): Android has real notifications */
const isApple = !Native && /iPhone|iPad|iPod|Macintosh|Mac OS X/i.test(navigator.userAgent || "");
/* a one-off reminder for my next review (10 min, 1 h…): on Apple devices the calendar rings for the app */
function nextDueAll(now){
  let m = Infinity;
  ((S.courses && S.courses.length) ? S.courses : [{id: S.active}]).forEach(c => { if (typeof cStatus === "function" && cStatus(c) === "pause") return; const t = c.id === S.active || !c.id ? nextDue(now) : withCourse(c.id, () => nextDue(now)); if (t < m) m = t; });
  return m;
}
function remindBlock(){
  if (!isApple) return "";
  const now = Date.now(), t = nextDueAll(now);
  if (!isFinite(t) || t - now > 2 * D) return "";
  const d = new Date(t), hm = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  return `<button class="btn secondary block" data-act="remindNext" data-at="${t}">⏰ ${T("remindBtn", hm, rel(t - now))}</button>`;
}
function remindNext(t){
  t = +t; if (!t) return;
  const pad = n => String(n).padStart(2, "0"), d = new Date(t), e = new Date(t + 10 * M);
  const f = x => x.getFullYear() + pad(x.getMonth() + 1) + pad(x.getDate()) + "T" + pad(x.getHours()) + pad(x.getMinutes()) + "00";
  const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+/, ""), url = location.protocol === "https:" ? location.href.split("#")[0] : "";
  const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Space Cards Memory//FR", "BEGIN:VEVENT", `UID:spacecards-rev-${t}@space-cards-memory`, `DTSTAMP:${stamp}`,
    `DTSTART:${f(d)}`, `DTEND:${f(e)}`, `SUMMARY:${T("remindEvent")}`, `DESCRIPTION:${T("calDesc")}`, url ? `URL:${url}` : "",
    "BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${T("remindEvent")}`, "TRIGGER:PT0M", "END:VALARM", "END:VEVENT", "END:VCALENDAR"].filter(Boolean).join("\r\n") + "\r\n";
  saveFile("space-cards-rappel.ics", ics).then(() => toast(T("remindDone"))).catch(() => toast(T("calFail")));
}
/* slots changed after the reminders were added: the app cannot touch the calendar, so it says what to do */
function calStaleBanner(){
  if (!isApple || !S.calStale) return "";
  return `<div class="banner stack"><strong>📅 ${T("calStaleTitle")}</strong><p class="small" style="margin:0">${T("calStaleHelp")}</p>
    <button class="btn block" data-act="calExport">📅 ${T("calStaleBtn")}</button>
    <button class="btn ghost small" data-act="calStaleOff" style="align-self:center">${T("calStaleSkip")}</button></div>`;
}
function calBlock(){
  if (!isApple) return "";
  if (S.calStale) return calStaleBanner();
  return `<section class="stack"><h3>📅 ${T("calTitle")}</h3><p class="muted small">${T("calHelp")}</p>
    <button class="btn secondary block" data-act="calExport">${T("calBtn")}</button></section>`;
}
function calExport(){
  const BY = ["SU", "MO", "TU", "WE", "TH", "FR", "SA"], pad = n => String(n).padStart(2, "0");
  const now = new Date(), stamp = now.toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
  const ev = [], url = location.protocol === "https:" ? location.href.split("#")[0] : "";
  const sil = [toMin(S.settings.silenceStart), toMin(S.settings.silenceEnd)];
  const quiet = m => !isNaN(sil[0]) && !isNaN(sil[1]) && (sil[0] > sil[1] ? (m >= sil[0] || m < sil[1]) : (m >= sil[0] && m < sil[1]));
  /* the same session time on several days = one weekly event (fewer events to delete if the slots change) */
  const groups = {};
  DAYS.forEach(d => (S.settings.slots[d] || []).forEach(([a, b]) => {
    const A = toMin(a), B = toMin(b); if (isNaN(A) || isNaN(B) || B <= A) return;
    slotSessions(A, B, S.settings.gap).forEach(x => { if (quiet(x.startMin)) return; const k = x.startMin + "-" + x.len; (groups[k] || (groups[k] = {m: x.startMin, len: x.len, days: []})).days.push(d); });
  }));
  const hm = m => pad(Math.floor(m / 60)) + pad(m % 60) + "00";
  Object.values(groups).sort((x, y) => x.m - y.m).forEach(g => {
    /* first date: the next of these days */
    const day = new Date(now); day.setHours(0, 0, 0, 0);
    for (let i = 0; i < 7 && !g.days.includes(day.getDay()); i++) day.setDate(day.getDate() + 1);
    const ymd = day.getFullYear() + pad(day.getMonth() + 1) + pad(day.getDate());
    ev.push(["BEGIN:VEVENT", `UID:spacecards-${g.m}-${g.len}@space-cards-memory`, `DTSTAMP:${stamp}`,
      `DTSTART:${ymd}T${hm(g.m)}`, `DTEND:${ymd}T${hm(Math.min(g.m + g.len, 1439))}`, `RRULE:FREQ=WEEKLY;BYDAY=${g.days.map(d => BY[d]).join(",")}`,
      `SUMMARY:${T("calEvent")}`, `DESCRIPTION:${T("calDesc")}`, url ? `URL:${url}` : "",
      "BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${T("calEvent")}`, "TRIGGER:PT0M", "END:VALARM", "END:VEVENT"].filter(Boolean).join("\r\n"));
  });
  if (!ev.length) return toast(T("calNone"));
  const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Space Cards Memory//FR", "CALSCALE:GREGORIAN", "X-WR-CALNAME:Space Cards Memory", ...ev, "END:VCALENDAR"].join("\r\n") + "\r\n";
  saveFile("space-cards-creneaux.ics", ics).then(() => { S.calMade = true; S.calStale = false; save(); if (view !== "session") render(); toast(T("calDone")); }).catch(() => toast(T("calFail")));
}

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
}
