<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;-webkit-tap-highlight-color:transparent}img{max-width:100%}[hidden]{display:none!important}input[type=text],input[type=number],input[type=search],input[type=time],select,textarea{box-sizing:border-box}</style>
<title>Space Cards Memory</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=Source+Sans+3:wght@400;600;700&family=Noto+Naskh+Arabic:wght@400;600&display=swap">
<style>
/* Layout: one-column phone app; the flashcard is the only raised object, navigation pinned to the bottom edge. */
:root{
  --bg:#D6ECFA; --surface:#FFFFFF; --ink:#132433; --muted:#4D6474; --line:#B9D3E6;
  --accent:#B3162D; --accent-wash:#F7E4E6; --green:#1E6A44; --green-wash:#E0EFE5; --on-accent:#FFFFFF;
  --display:"Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --body:"Source Sans 3", "Segoe UI", Roboto, sans-serif;
  --arabic:"Noto Naskh Arabic", "Geeza Pro", "Times New Roman", serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1C29; --surface:#16293B; --ink:#E6EFF6; --muted:#97ADBE; --line:#26405A;
  --accent:#F2596E; --accent-wash:#3A1C22; --green:#62C48F; --green-wash:#163020; --on-accent:#140A0C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1C29; --surface:#16293B; --ink:#E6EFF6; --muted:#97ADBE; --line:#26405A;
  --accent:#F2596E; --accent-wash:#3A1C22; --green:#62C48F; --green-wash:#163020; --on-accent:#140A0C; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.wrap{max-width:560px;margin:0 auto;padding-block:20px 110px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.75rem} h2{font-size:1.25rem} h3{font-size:1.05rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.label{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.num{font-variant-numeric:tabular-nums}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{border:0;border-radius:12px;padding:14px 18px;font-weight:700;background:var(--accent);color:var(--on-accent);font-size:1rem;min-height:48px}
.btn.secondary{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost{background:transparent;color:var(--accent);padding:8px 4px;min-height:auto}
.btn.small{padding:8px 12px;min-height:38px;font-size:.92rem}
.btn:disabled{opacity:.4;cursor:default}
.btn.block{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}

/* Home */
.hero{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{padding:16px 0;border-top:2px solid var(--ink)}
.stat .big{font-family:var(--display);font-size:2.6rem;font-weight:700;line-height:1}
.stat.due .big{color:var(--accent)}
.ladder{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;align-items:end;height:64px}
.ladder div{background:var(--green);border-radius:3px 3px 0 0;min-height:3px}
.ladder-labels{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted)}
.langbar{display:grid;grid-template-columns:5.5rem 1fr 2.6rem;gap:10px;align-items:center;font-size:.92rem}
.langbar .track{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.langbar .fill{height:100%;background:var(--green)}

/* Today's plan */
.plan{display:flex;flex-direction:column;border-top:2px solid var(--ink)}
.slot{display:grid;grid-template-columns:4.6rem 1fr auto;gap:4px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.slot .time{font-family:var(--display);font-weight:700;font-size:1.1rem;font-variant-numeric:tabular-nums}
.slot .what{min-width:0}
.slot .len{font-size:.82rem;color:var(--muted)}
.slot.past{opacity:.45}
.slot.now{background:var(--accent-wash);margin:0 -10px;padding:12px 10px;border-radius:12px;border-bottom-color:transparent}
.slot.now .time{color:var(--accent)}
.tag{font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.snooze{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.snooze button{padding:9px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:.92rem;font-variant-numeric:tabular-nums}
.snooze button.go{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.snooze button:disabled{opacity:.35;cursor:default}
.notif{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.notif-app{font-size:.75rem;color:var(--muted)}
.notif-title{font-weight:700}
.notif-body{color:var(--muted);font-size:.92rem}
.notif-actions{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:.85rem;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.03em}

/* Session */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.timer{font-family:var(--display);font-weight:700;font-size:1.1rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 20px;display:flex;flex-direction:column;gap:16px;box-shadow:0 1px 0 var(--line), 0 12px 30px -18px rgba(20,40,30,.35)}
.recto{min-height:260px;justify-content:center;text-align:center;cursor:pointer}
.recto .fr{font-family:var(--display);font-size:1.9rem;font-weight:700;line-height:1.15}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.chip{font-size:.78rem;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--accent-wash);color:var(--accent)}
.chip.theme{background:var(--green-wash);color:var(--green)}
.chip.new{background:var(--ink);color:var(--bg)}
.verso-fr{font-family:var(--display);font-weight:700;font-size:1.15rem;padding-bottom:12px;border-bottom:1px solid var(--line)}
.lang{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;padding:6px 0}
.lang .name{grid-column:1/-1}
.lang .txt{font-size:1.2rem;font-weight:600;min-width:0;overflow-wrap:anywhere}
.lang.rest .txt{font-size:1rem;font-weight:400;color:var(--muted)}
.lang .txt[lang="ar"]{font-family:var(--arabic);font-size:1.55rem;line-height:1.9;font-weight:400;text-align:right}
.lang.rest .txt[lang="ar"]{font-size:1.25rem}
.lang .empty{color:var(--muted);font-style:italic;font-size:.95rem}
.grade{display:flex;gap:6px}
.grade button{width:52px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:transparent;font-size:1.25rem;font-weight:700;color:var(--muted)}
.grade button.ok[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--bg)}
.grade button.ko[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.note{background:var(--green-wash);border-radius:10px;padding:10px 12px;font-size:.95rem}
.sticky-foot{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom, 0px))}
.waiting{text-align:center;padding:40px 10px}
.waiting .big{font-family:var(--display);font-size:3rem;font-weight:700}

/* Session setup */
.seg{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;padding:12px 6px;border:0;background:none;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.choices{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.choices button{padding:12px 0;border-radius:10px;border:1.5px solid var(--line);background:none;font-weight:700;font-size:1.05rem;font-variant-numeric:tabular-nums}
.choices button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-wash);color:var(--accent)}
.choices button:disabled{opacity:.35;cursor:default}

/* Forms */
.tabs{display:flex;border-bottom:1.5px solid var(--line)}
.tabs button{flex:1;background:none;border:0;padding:12px 4px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1.5px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:.85rem;font-weight:600;color:var(--muted)}
.banner{background:var(--green-wash);border-radius:14px;padding:14px 16px}
.logo{width:52px;height:52px;flex:none;border-radius:12px}
.langgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.cardimg{max-width:100%;max-height:240px;border-radius:12px;object-fit:contain;align-self:center}
.cardimg.small{max-height:120px}
.imgbox{display:flex;flex-direction:column;gap:8px}
.imgbox img{max-width:100%;max-height:180px;border-radius:10px;object-fit:contain;align-self:flex-start}
label.btn{display:inline-flex;align-items:center;justify-content:center}
.audbox{display:flex;flex-direction:column;gap:6px}
.btn.recording{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.play{border:1.5px solid var(--line);background:none;border-radius:999px;width:36px;height:36px;font-size:.9rem;color:var(--accent);flex:none}
.lang .txtrow{display:flex;gap:8px;align-items:center;min-width:0}
.dose{margin-top:-6px}
input[type=text],input[type=number],input[type=search],input[type=time],select,textarea{width:100%;box-sizing:border-box;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);padding:11px 12px;font-size:1rem;min-width:0}
input[dir=rtl]{font-family:var(--arabic);font-size:1.2rem}
textarea{min-height:120px;resize:vertical}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom, 0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:20;max-width:90%}
.warn{background:var(--accent-wash);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:.92rem}
.info{border-left:3px solid var(--green);padding:4px 0 4px 12px;font-size:.92rem;color:var(--muted)}

/* Planning */
.day{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-bottom:1px solid var(--line)}
.day-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.slotedit{display:grid;grid-template-columns:1fr auto 1fr auto;gap:8px;align-items:center}
.slotedit .x{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:none;font-size:1.1rem;color:var(--muted)}
.sessions-preview{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.toggle{display:flex;gap:10px;align-items:flex-start}
.toggle input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent)}

/* List */
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.item .fr{font-weight:600}
.item .eu{color:var(--muted);font-size:.92rem}
.dots{display:flex;gap:3px;grid-row:1/3;grid-column:2;align-self:center}
.dot{width:9px;height:22px;border-radius:3px;background:var(--line);position:relative}
.dot i{position:absolute;left:0;right:0;bottom:0;background:var(--green);border-radius:3px}
.dot.due i{background:var(--accent)}

/* Nav */
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;
  padding-bottom:env(safe-area-inset-bottom, 0px);padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));z-index:10}
nav.bottom .in{display:flex;max-width:560px;width:100%}
nav.bottom button{flex:1;min-width:0;background:none;border:0;padding:11px 0 13px;font-size:.76rem;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px}
nav.bottom button[aria-current="page"]{color:var(--accent)}
nav.bottom svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion: no-preference){.card{animation:rise .18s ease-out}@keyframes rise{from{transform:translateY(6px)}to{transform:none}}}

.flabel{font-size:.85rem;font-weight:600;color:var(--muted)}
.inrow{display:flex;gap:8px;align-items:stretch}
.inrow input{flex:1}
.mic{flex:none;width:48px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:1.1rem}
.txtrow.center{justify-content:center}
.txtrow .fr{font-family:var(--display);font-size:1.9rem;font-weight:700;line-height:1.15;min-width:0;overflow-wrap:anywhere}
.bigplay{align-self:center;width:96px;height:96px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);font-size:2rem}
.qa{display:flex;flex-direction:column;gap:4px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.qa.answer{border-bottom:0}
.qa.answer .txt{font-size:1.5rem;font-weight:700}
.gradebar{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:sticky;bottom:calc(12px + env(safe-area-inset-bottom, 0px))}
.gradebar button{min-height:56px;border-radius:12px;border:0;font-weight:700;font-size:1.05rem}
.gradebar .ok{background:var(--green);color:var(--bg)}
.gradebar .ko{background:var(--accent);color:var(--on-accent)}
.goodans{background:var(--green-wash);color:var(--green);border-radius:10px;padding:10px 12px;font-weight:700}
.badans{background:var(--accent-wash);border-radius:10px;padding:10px 12px}
.langbtn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 8px}
.langbtn small{font-weight:400;color:var(--muted);font-size:.78rem}
.tablewrap{overflow-x:auto}
table.caps{border-collapse:collapse;width:100%;font-size:.92rem}
table.caps th,table.caps td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:start}
table.caps thead th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
table.caps .ok{color:var(--green);font-weight:700}
table.caps .ko{color:var(--accent);font-weight:700}
[dir=rtl] .info{border-left:0;border-right:3px solid var(--green);padding:4px 12px 4px 0}
[dir=rtl] .item{text-align:right}
[dir=rtl] body{font-family:var(--arabic), var(--body)}
.errbox{position:fixed;left:12px;right:12px;bottom:calc(90px + env(safe-area-inset-bottom, 0px));z-index:30;background:var(--accent);color:var(--on-accent);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.cropov{position:fixed;inset:0;z-index:40;background:#0b1420;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom, 0px))}
.croptitle{color:#fff;font-weight:700;margin:0}
.cropstage{position:relative;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;max-width:100%}
.cropstage img,.cropstage canvas.cropimg{display:block;max-width:100%;max-height:68vh;width:auto;height:auto;pointer-events:none}
.cropbox{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.55);touch-action:none;cursor:move}
.cropbox i{position:absolute;width:28px;height:28px;border:4px solid #fff;touch-action:none}
.cropbox i[data-h=nw]{left:-4px;top:-4px;border-right:0;border-bottom:0}
.cropbox i[data-h=ne]{right:-4px;top:-4px;border-left:0;border-bottom:0}
.cropbox i[data-h=sw]{left:-4px;bottom:-4px;border-right:0;border-top:0}
.cropbox i[data-h=se]{right:-4px;bottom:-4px;border-left:0;border-top:0}
.drawtools{display:flex;flex-direction:column;gap:8px;width:100%;max-width:520px}
.drawbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.drawbar button{min-height:42px;padding:0 12px;border-radius:10px;border:1.5px solid #fff4;background:transparent;color:#fff;font-weight:700;font-size:.95rem}
.drawbar button[aria-pressed=true]{background:#fff;color:#0b1420}
.drawbar button.ink{width:42px;padding:0;border:3px solid #fff4}
.drawbar button.ink[aria-pressed=true]{border-color:#fff;outline:2px solid #fff;outline-offset:2px}
.drawbar button:disabled{opacity:.35}
.infobtn{flex:none;width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:var(--ink);font-family:Georgia,serif;font-style:italic;font-weight:700;font-size:1.25rem}
.infotext h3{margin:14px 0 2px}
.infotext p,.infotext li{line-height:1.5}
.infotext ul{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px}
.infoscale{font-weight:700;background:var(--surface);border-radius:10px;padding:10px 12px}
.progress{background:var(--surface);border-radius:14px;padding:12px 14px;gap:4px}
.progress .big{font-family:var(--display);font-size:2rem;font-weight:800;color:var(--green)}
.cheer{background:var(--green-wash);color:var(--ink);border-radius:12px;padding:12px 14px;gap:6px}
.selbar{position:sticky;top:0;z-index:5;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;gap:8px}
.item.selitem{display:grid;grid-template-columns:28px 1fr;cursor:pointer}
.item.selitem input{width:22px;height:22px;grid-row:span 3;align-self:center;accent-color:var(--accent)}
.item.selitem > span{grid-column:2}
.fold{border:1.5px solid var(--line);border-radius:14px;background:var(--surface);padding:0 14px}
.fold > summary{list-style:none;cursor:pointer;padding:14px 0;font-family:var(--display);font-weight:700;font-size:1.05rem;display:flex;justify-content:space-between;align-items:center;gap:10px}
.fold > summary::-webkit-details-marker{display:none}
.fold > summary::after{content:"▾";color:var(--muted);transition:transform .15s}
.fold[open] > summary::after{transform:rotate(180deg)}
.fold .foldin{padding-bottom:14px}
.btn.big{min-height:60px;font-size:1.15rem}
.mtnote{display:block;width:100%;text-align:start;background:transparent;border:0;border-inline-start:3px solid #E0A100;padding:6px 10px;color:var(--ink);font-size:.9rem;line-height:1.4;cursor:pointer}
.sugg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:6px}
.sugg:empty{display:none}
.sugg button{flex:none;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:6px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:.9rem}
.croprow{display:flex;gap:10px;width:100%;max-width:520px}
.croprow button{flex:1;min-height:48px;border-radius:12px;border:1.5px solid #fff4;background:transparent;color:#fff;font-weight:700;font-size:.95rem}
.croprow button.main{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.cchips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.cchips::-webkit-scrollbar{display:none}
.cchip{flex:none;display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;font-size:.95rem}
.cchip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.cchip b{background:var(--accent);color:var(--on-accent);border-radius:999px;padding:1px 8px;font-size:.8rem}
.cchip.add{border-style:dashed;font-weight:600;color:var(--muted)}
.crow{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.rulist{display:flex;flex-direction:column;max-height:50vh;overflow:auto;border:1.5px solid var(--line);border-radius:12px;background:var(--surface)}
.ruitem{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.ruitem span{flex:1}
.ruitem img{width:40px;height:32px;object-fit:cover;border-radius:6px}
hr.sep{border:0;border-top:1.5px solid var(--line);width:100%;margin:18px 0 6px}
.errbox code{white-space:pre-wrap;word-break:break-word;font-size:.85rem}
.errbox button{align-self:flex-end;border:0;border-radius:8px;padding:6px 14px;font-weight:700;background:var(--surface);color:var(--ink)}
.medal{margin:0;background:var(--green-wash);border-radius:10px;padding:8px 10px}
.pbar{height:10px;border-radius:5px;background:rgba(0,0,0,.08);overflow:hidden}
.pbar > div{height:100%;background:var(--green);border-radius:5px}
.flash{margin:0;text-align:center;font-weight:800;font-size:1.1rem;color:var(--green);background:var(--green-wash);border-radius:10px;padding:8px}
.mcq{display:flex;flex-direction:column;gap:8px}
.mcq button{min-height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:1.1rem;font-weight:600;padding:8px 12px}
.mcq button.right{background:var(--green);border-color:var(--green);color:var(--bg)}
.mcq button.wrong{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.mcq button.dim{opacity:.45}
.mcq button:disabled{cursor:default}
.lvl{display:grid;grid-template-columns:1fr 2.4rem;gap:2px 10px;align-items:center}
.lvl > span:first-child{display:flex;flex-direction:column;font-weight:600}
.lvl small{font-weight:400;color:var(--muted);font-size:.78rem}
.lvl .num{text-align:end;font-weight:800;font-size:1.1rem}
.lvl .track{grid-column:1 / -1;height:8px;border-radius:4px;background:rgba(0,0,0,.08);overflow:hidden}
.lvl .fill{height:100%;background:var(--green)}
.lvl .fill.lv0{background:var(--muted)}
.lvl .fill.lv1{background:#E0A100}
.suitr{color:#C62828;font-variant-emoji:text}
mark{background:#FFE58A;color:inherit;border-radius:4px;padding:0 3px}
.hole{display:inline-block;min-width:2.5em;border-bottom:2px solid currentColor;text-align:center}
.insbar{display:flex;gap:8px}
.insbar button{flex:1;min-height:44px;font-size:1.4rem;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.insbar button.suitr{color:#C62828}
.loadbox{background:var(--surface);border-radius:12px;padding:10px 12px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:120px;margin:6px 0}
.wday{display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end}
.wbar{width:100%;max-width:28px;flex:1;display:flex;align-items:flex-end}
.wbar > div{width:100%;background:var(--green);border-radius:4px 4px 0 0;min-height:2px}
</style>

  infoTitle: "Comment fonctionne l'app",
  infoBody: scale => `<h3>Le but</h3>
    <p>Retenir pour longtemps le vocabulaire d'une langue, avec quelques minutes de travail par jour. Chaque mot est une carte : d'un côté ta langue, de l'autre la langue que tu apprends, avec si tu veux une image et ta propre voix.</p>
    <h3>La courbe de l'oubli</h3>
    <p>Le psychologue Hermann Ebbinghaus a montré dès 1885 qu'on oublie très vite ce qu'on vient d'apprendre : en quelques heures puis quelques jours, la plus grande partie s'efface si on ne la revoit pas. Mais chaque fois qu'on se rappelle un mot au bon moment, le souvenir se renforce et s'efface ensuite plus lentement.</p>
    <h3>Les répétitions espacées</h3>
    <p>L'app te repropose chaque carte juste avant que tu risques de l'oublier, à des intervalles de plus en plus longs :</p>${scale}

    <h3>Comment s'en servir</h3>
    <ul><li>Saisis tes nouveaux mots après chaque cours : l'app les répartit jusqu'au cours suivant.</li>
    <li>Réponds aux notifications sur tes créneaux : les séances sont courtes, 25 minutes au plus.</li>
    <li>Après 25 minutes, fais une pause de 5 minutes : le cerveau mémorise pendant la pause (méthode Pomodoro).</li>
    <li>Sois honnête : si tu as hésité, réponds « À revoir ». C'est ce qui rend les révisions efficaces.</li></ul>
    <h3>Pour mieux retenir</h3>
    <ul><li>Une image et ta voix sur la carte : le mot est mémorisé par plusieurs chemins à la fois.</li>

  infoTitle: "How the app works",
  infoBody: scale => `<h3>The goal</h3>
    <p>To remember the vocabulary of a language for a long time, with a few minutes a day. Each word is a card: your language on one side, the language you learn on the other, with an image and your own voice if you like.</p>
    <h3>The forgetting curve</h3>
    <p>In 1885 the psychologist Hermann Ebbinghaus showed that we forget what we have just learned very fast: within hours, then days, most of it fades if we do not see it again. But each time we recall a word at the right moment, the memory gets stronger and fades more slowly.</p>
    <h3>Spaced repetition</h3>
    <p>The app shows each card again just before you are likely to forget it, at longer and longer intervals:</p>${scale}
    <p>When you get it right, the card moves to the next interval. When you get it wrong, it comes back in 10 minutes and starts the scale again. The result: few reviews, and words that stay for years.</p>
    <h3>How to use it</h3>
    <ul><li>Add your new words after each lesson: the app spreads them until the next lesson.</li>
    <li>Answer the notifications in your time slots: sessions are short, 25 minutes at most.</li>
    <li>After 25 minutes, take a 5-minute break: the brain stores memories during the break (Pomodoro technique).</li>
    <li>Be honest: if you hesitated, answer "Review again". That is what makes the reviews work.</li></ul>
    <h3>To remember better</h3>
    <ul><li>An image and your voice on the card: the word is stored through several paths at once.</li>
    <li>Say the word aloud before turning the card.</li>
    <li>Alternate the directions: from your language to the one you learn, and back.</li></ul>`
});

    <h3>A curva do esquecimento</h3><p>Em 1885, o psicólogo Hermann Ebbinghaus mostrou que esquecemos muito depressa o que acabámos de aprender. Mas cada vez que recordamos uma palavra no momento certo, a memória fortalece-se e apaga-se mais devagar.</p>
    <h3>A repetição espaçada</h3><p>A app volta a mostrar cada cartão pouco antes de o esqueceres, com intervalos cada vez mais longos:</p>${scale}
    <p>Se acertas, o cartão passa ao intervalo seguinte; se erras, volta em 10 minutos e recomeça.</p>
    <h3>Como usar</h3><ul><li>Escreve as palavras novas depois de cada aula.</li><li>Responde às notificações: sessões de 25 minutos no máximo.</li><li>Depois de 25 minutos, 5 minutos de pausa (técnica Pomodoro).</li><li>Sê honesto: se hesitaste, escolhe «A rever».</li></ul>`
});

Object.assign(I18N.fr, {"writeYourself": "Le principe de l'app : écris toi-même le mot et sa traduction en {0}, comme tu l'as appris en cours. C'est plus sûr, et écrire aide déjà à retenir. La traduction automatique n'est qu'une aide, à vérifier.", "infoTranslate": "<h3>Écrire soi-même, c'est déjà apprendre</h3>\n    <p>Le principe de l'app : c'est toi qui écris le mot dans ta langue et sa traduction dans la langue que tu apprends, telle que tu l'as vue en cours, dans ton livre ou avec ton professeur. Écrire le mot aide déjà à le retenir, et tu es sûr qu'il est juste.</p>\n    <h3>La traduction automatique : une aide, avec des limites</h3>\n    <ul><li>Elle se trompe souvent sur les mots seuls qui ont plusieurs sens (« grand » : big ou tall ?), sur les verbes comme « s'étonner », sur les expressions et sur le niveau de langue.</li>\n    <li>Sur le téléphone, entre deux langues autres que l'anglais, elle passe par l'anglais (français → anglais → espagnol) : chaque étape ajoute des erreurs.</li>\n    <li>Pour les moins de 15 ans, seule la traduction sur le téléphone est utilisée : rien n'est envoyé sur Internet.</li>\n    <li>Les cartes traduites automatiquement sont marquées 🤖 : vérifie-les avant de les apprendre (Cartes › 🤖 À vérifier).</li></ul>\n    <h3>Pour une meilleure traduction</h3>\n    <ul><li>Le plus fiable : ton cours, ton professeur, un dictionnaire.</li>\n    <li>Pour beaucoup de mots d'un coup : Ajouter › Import · Export › « Copier pour une IA » ou « Google Sheets », puis colle le tableau corrigé dans « Importer ». Pour un enfant, à faire avec un adulte.</li>\n    <li>Un fichier de cartes déjà traduites, préparé par un enseignant ou un parent, s'importe en un geste.</li>\n    <li>Ajoute une note pour préciser le sens : « grand (taille) », « queue (file d'attente) ».</li></ul>"});
Object.assign(I18N.en, {"writeYourself": "The idea of the app: write the word and its {0} translation yourself, as you learned it in class. It is more reliable, and writing already helps you remember. Automatic translation is only a help, to be checked.", "infoTranslate": "<h3>Writing it yourself is already learning</h3>\n    <p>The idea of the app: you write the word in your language and its translation in the language you learn, as you saw it in class, in your book or with your teacher. Writing the word already helps you remember it, and you know it is right.</p>\n    <h3>Automatic translation: a help, with limits</h3>\n    <ul><li>It often gets single words with several meanings wrong (\"big\" or \"tall\"?), reflexive verbs, expressions and register.</li>\n    <li>On the phone, between two languages other than English, it goes through English: each step adds mistakes.</li>\n    <li>Under 15, only the on-phone translation is used: nothing is sent over the Internet.</li>\n    <li>Cards translated automatically are marked 🤖: check them before learning them (Cards › 🤖 To check).</li></ul>\n    <h3>For a better translation</h3>\n    <ul><li>Most reliable: your lessons, your teacher, a dictionary.</li>\n    <li>For many words at once: Add › Import · Export › \"Copy for an AI\" or \"Google Sheets\", then paste the corrected table into \"Import\". For a child, do it with an adult.</li>\n    <li>A file of cards already translated by a teacher or a parent imports in one go.</li>\n    <li>Add a note to make the meaning clear: \"tall (height)\".</li></ul>"});
Object.assign(I18N.es, {"writeYourself": "La idea de la app: escribe tú mismo la palabra y su traducción en {0}, como la aprendiste en clase. Es más fiable, y escribir ya ayuda a recordar. La traducción automática solo es una ayuda, que hay que revisar.", "infoTranslate": "<h3>Escribirlo uno mismo ya es aprender</h3><p>La idea de la app: tú escribes la palabra en tu idioma y su traducción, tal como la viste en clase o en tu libro. Escribir ya ayuda a recordar, y sabes que es correcta.</p>\n    <h3>La traducción automática: una ayuda con límites</h3><ul><li>Se equivoca a menudo con palabras sueltas de varios sentidos, verbos pronominales y expresiones.</li><li>En el teléfono, entre dos idiomas que no son el inglés, pasa por el inglés: cada paso añade errores.</li><li>Para menores de 15 años solo se usa la traducción del teléfono: nada se envía por Internet.</li><li>Las tarjetas traducidas automáticamente llevan 🤖: revísalas antes de aprenderlas.</li></ul>\n    <h3>Para una traducción mejor</h3><ul><li>Lo más fiable: tu clase, tu profesor, un diccionario.</li><li>Para muchas palabras: Añadir › Importar · Exportar › «Copiar para una IA» o «Google Sheets», y luego importa la tabla corregida. Para un niño, con un adulto.</li><li>Un archivo de tarjetas ya traducidas se importa de una vez.</li></ul>"});
Object.assign(I18N.de, {"writeYourself": "Die Idee der App: Schreib das Wort und seine Übersetzung auf {0} selbst, so wie du es im Kurs gelernt hast. Das ist zuverlässiger, und Schreiben hilft schon beim Merken. Automatische Übersetzung ist nur eine Hilfe, die man prüfen muss.", "infoTranslate": "<h3>Selbst schreiben ist schon lernen</h3><p>Die Idee der App: Du schreibst das Wort und seine Übersetzung selbst, so wie du es im Kurs oder im Buch gesehen hast. Schreiben hilft beim Merken, und du weißt, dass es stimmt.</p>\n    <h3>Automatische Übersetzung: eine Hilfe mit Grenzen</h3><ul><li>Sie irrt sich oft bei einzelnen Wörtern mit mehreren Bedeutungen, reflexiven Verben und Ausdrücken.</li><li>Auf dem Telefon geht sie zwischen zwei Sprachen außer Englisch über Englisch: jeder Schritt bringt Fehler.</li><li>Unter 15 wird nur die Übersetzung auf dem Telefon genutzt: nichts geht ins Internet.</li><li>Automatisch übersetzte Karten tragen 🤖: prüfe sie vor dem Lernen.</li></ul>\n    <h3>Für eine bessere Übersetzung</h3><ul><li>Am zuverlässigsten: dein Kurs, deine Lehrkraft, ein Wörterbuch.</li><li>Für viele Wörter: Hinzufügen › Import · Export › „Für eine KI kopieren“ oder „Google Sheets“, dann die korrigierte Tabelle importieren. Kinder mit einem Erwachsenen.</li><li>Eine Datei mit fertig übersetzten Karten lässt sich auf einmal importieren.</li></ul>"});
Object.assign(I18N.it, {"writeYourself": "L'idea dell'app: scrivi tu la parola e la sua traduzione in {0}, come l'hai imparata a lezione. È più sicuro, e scrivere aiuta già a ricordare. La traduzione automatica è solo un aiuto, da controllare.", "infoTranslate": "<h3>Scrivere da sé è già imparare</h3><p>L'idea dell'app: scrivi tu la parola e la traduzione, come l'hai vista a lezione o nel libro. Scrivere aiuta a ricordare, e sai che è giusta.</p>\n    <h3>La traduzione automatica: un aiuto con dei limiti</h3><ul><li>Sbaglia spesso con parole isolate con più significati, verbi riflessivi ed espressioni.</li><li>Sul telefono, tra due lingue diverse dall'inglese, passa per l'inglese: ogni passaggio aggiunge errori.</li><li>Sotto i 15 anni si usa solo la traduzione del telefono: niente viene inviato su Internet.</li><li>Le schede tradotte automaticamente hanno 🤖: controllale prima di impararle.</li></ul>\n    <h3>Per una traduzione migliore</h3><ul><li>Il più affidabile: la lezione, l'insegnante, un dizionario.</li><li>Per molte parole: Aggiungi › Importa · Esporta › «Copia per un'IA» o «Google Sheets», poi importa la tabella corretta. Per un bambino, con un adulto.</li><li>Un file di schede già tradotte si importa in un colpo.</li></ul>"});
Object.assign(I18N.pt, {"writeYourself": "A ideia da app: escreve tu a palavra e a tradução em {0}, como aprendeste na aula. É mais fiável, e escrever já ajuda a memorizar. A tradução automática é só uma ajuda, a verificar.", "infoTranslate": "<h3>Escrever é já aprender</h3><p>A ideia da app: és tu que escreves a palavra e a tradução, como as viste na aula ou no livro. Escrever ajuda a memorizar, e sabes que está certo.</p>\n    <h3>A tradução automática: uma ajuda com limites</h3><ul><li>Engana-se muitas vezes com palavras soltas de vários sentidos, verbos pronominais e expressões.</li><li>No telefone, entre duas línguas que não o inglês, passa pelo inglês: cada passo acrescenta erros.</li><li>Abaixo dos 15 anos só se usa a tradução do telefone: nada é enviado pela Internet.</li><li>Os cartões traduzidos automaticamente têm 🤖: verifica-os antes de os aprender.</li></ul>\n    <h3>Para uma tradução melhor</h3><ul><li>O mais fiável: a aula, o professor, um dicionário.</li><li>Para muitas palavras: Adicionar › Importar · Exportar › «Copiar para uma IA» ou «Google Sheets», depois importa a tabela corrigida. Para uma criança, com um adulto.</li><li>Um ficheiro de cartões já traduzidos importa-se de uma vez.</li></ul>"});
Object.assign(I18N.ar, {"writeYourself": "فكرة التطبيق: اكتب بنفسك الكلمة وترجمتها بـ{0} كما تعلمتها في الدرس. هذا أوثق، والكتابة تساعد على الحفظ. الترجمة التلقائية مجرد مساعدة يجب التحقق منها.", "infoTranslate": "<h3>الكتابة بنفسك تعلّم</h3><p>فكرة التطبيق: أنت من يكتب الكلمة وترجمتها كما رأيتها في الدرس أو الكتاب. الكتابة تساعد على الحفظ، وتعرف أنها صحيحة.</p>\n    <h3>الترجمة التلقائية: مساعدة لها حدود</h3><ul><li>تخطئ كثيرًا في الكلمات المنفردة متعددة المعاني والأفعال والتعابير.</li><li>على الهاتف، بين لغتين غير الإنجليزية، تمر عبر الإنجليزية فتزيد الأخطاء.</li><li>لمن هم دون 15 سنة تُستخدم ترجمة الهاتف فقط: لا يُرسل شيء عبر الإنترنت.</li><li>البطاقات المترجمة تلقائيًا تحمل 🤖: راجعها قبل حفظها.</li></ul>\n    <h3>لترجمة أفضل</h3><ul><li>الأوثق: درسك، معلمك، القاموس.</li><li>لكلمات كثيرة: إضافة › استيراد · تصدير › «نسخ لذكاء اصطناعي» أو «Google Sheets» ثم استورد الجدول المصحح. للأطفال بمساعدة شخص بالغ.</li><li>ملف بطاقات مترجمة مسبقًا يُستورد دفعة واحدة.</li></ul>"});
Object.assign(I18N.tr, {"writeYourself": "Uygulamanın ilkesi: kelimeyi ve {0} çevirisini derste öğrendiğin gibi kendin yaz. Daha güvenilirdir ve yazmak hatırlamaya yardım eder. Otomatik çeviri yalnızca kontrol edilmesi gereken bir yardımdır.", "infoTranslate": "<h3>Kendin yazmak zaten öğrenmektir</h3><p>Uygulamanın ilkesi: kelimeyi ve çevirisini derste ya da kitapta gördüğün gibi sen yazarsın. Yazmak hatırlamaya yardım eder ve doğru olduğunu bilirsin.</p>\n    <h3>Otomatik çeviri: sınırları olan bir yardım</h3><ul><li>Çok anlamlı tek kelimelerde, dönüşlü fiillerde ve deyimlerde sık yanılır.</li><li>Telefonda, İngilizce dışındaki iki dil arasında İngilizce üzerinden geçer: her adım hata ekler.</li><li>15 yaş altında yalnızca telefondaki çeviri kullanılır: İnternete hiçbir şey gönderilmez.</li><li>Otomatik çevrilen kartlarda 🤖 vardır: öğrenmeden önce kontrol et.</li></ul>\n    <h3>Daha iyi bir çeviri için</h3><ul><li>En güvenilir: dersin, öğretmenin, bir sözlük.</li><li>Çok kelime için: Ekle › İçe · Dışa aktar › «Yapay zekâ için kopyala» ya da «Google Sheets», sonra düzeltilmiş tabloyu içe aktar. Çocuklar bir yetişkinle yapsın.</li><li>Önceden çevrilmiş kart dosyası tek seferde içe aktarılır.</li></ul>"});

async function startRec(){

/* ---------- Hands-free reviews (driving, walking…): the app reads the question, gives time to answer aloud,

const hf = {on: false, tok: 0, state: "", until: 0, lock: null};
const hfSleep = ms => new Promise(r => setTimeout(r, ms));

  try {
    if (player) player.pause();
    if (P){ await P.stop().catch(() => {}); await P.speak({text, lang: bcp(code), rate: 0.9, category: "playback"}); return true; }

      await new Promise(res => { u.onend = res; u.onerror = res; speechSynthesis.cancel(); speechSynthesis.speak(u); setTimeout(res, 2500 + text.length * 120); });
      return true;

}
async function playAudWait(id){

const HF_WORDS = {
  ko: /\b(non|nan|faux|pas su|savais pas|sais pas|revoir|rate|perdu|no|wrong|nope)\b/,
  ok: /\b(oui|ouais|ouai|juste|bon|bonne|correct|exact|su|savais|gagne|yes|yeah|right|ok|okay)\b/,
  repeat: /\b(repete|repeter|repetes|encore|redis|again|repeat)\b/,
  stop: /\b(stop|arrete|arreter|termine|fin|pause)\b/
};
function hfParse(list){
  for (const raw of list || []){
    const s = " " + String(raw).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z' ]/g, " ") + " ";
    for (const k of ["stop", "repeat", "ko", "ok"]) if (HF_WORDS[k].test(s)) return k;
  }

}
async function hear(){
  const lang = bcp(UI === "ar" || UI === "tr" ? "fr" : UI), R = plug("SpeechRecognition");
  if (R){
    /* Android: listen to partial results and stop as soon as "oui" / "non" is heard (the final result does not always come back) */
    let got = null, ended = false, hp = null, hs = null;
    try {
      const p = R.checkPermissions ? await R.checkPermissions() : null;
      if (!p || p.speechRecognition !== "granted"){ const q = await R.requestPermissions(); if (q && q.speechRecognition && q.speechRecognition !== "granted"){ toast(T("micDenied", APP)); return "nomic"; } }
      hp = await R.addListener("partialResults", d => { const k = hfParse((d && (d.matches || d.value)) || []); if (k && !got){ got = k; R.stop().catch(() => {}); } });
      try { hs = await R.addListener("listeningState", d => { if (d && d.status === "stopped") ended = true; }); } catch(e){}
      const r = await withTimeout(R.start({language: lang, maxResults: 5, partialResults: true, popup: false}), 8000, null);
      if (!got && r && r.matches) got = hfParse(r.matches);
      const t0 = Date.now();
      while (!got && !ended && Date.now() - t0 < 7000) await hfSleep(150);
      if (!got) await hfSleep(400);
    } catch(e){}
    try { await R.stop(); } catch(e){}
    try { hp && hp.remove(); hs && hs.remove(); } catch(e){}
    return got;
  }

    let done = false; const fin = v => { if (!done){ done = true; try { r.stop(); } catch(e){} resolve(v); } };
    const r = new W(); r.lang = lang; r.maxAlternatives = 5; r.interimResults = true; r.continuous = false;
    r.onresult = e => { for (let i = e.resultIndex || 0; i < e.results.length; i++){ const k = hfParse([...e.results[i]].map(a => a.transcript)); if (k) return fin(k); } };

/* while listening, big buttons still work (for anyone not driving) */
function hfTap(res){ if (!hf.on || !sess || !sess.cur) return; hf.tapped = res; }
async function hfBegin(){

  render();

  while (hfAlive(tok)){
    if (!sess.cur){ if (sess.waitUntil){ hf.state = "wait"; await hfSleep(1000); continue; } break; }
    const c = card(sess.cur); if (!c) break; const id = c.id;
    hf.state = "q"; render();
    await hfSide(promptSide(c), c);
    if (!hfAlive(tok) || sess.cur !== id) continue;
    const wait = S.settings.hfWait || 5;
    hf.state = "think"; hf.until = Date.now() + wait * 1000; render();
    await hfSleep(wait * 1000);
    if (!hfAlive(tok) || sess.cur !== id) continue;
    sess.flipped = true; hf.state = "a"; render();
    await hfSide(answerSide(c), c);
    let res = null;
    for (let tries = 0; tries < 3 && hfAlive(tok) && sess.cur === id; tries++){
      hf.state = "listen"; render();
      await sayWait(T(tries ? "hfAgain" : "hfAsk"), ui);
      if (!hfAlive(tok) || sess.cur !== id) break;
      hf.tapped = null;
      res = await Promise.race([hear(), (async () => { while (!hf.tapped && hfAlive(tok)) await hfSleep(150); return hf.tapped; })()]);
      try { const R = plug("SpeechRecognition"); if (R) await R.stop(); } catch(e){}
      if (res === "nomic"){ hfStop(); toast(T("hfNoMic")); return; }
      if (res === "repeat"){ await hfSide(promptSide(c), c); await hfSide(answerSide(c), c); res = null; tries--; continue; }
      if (res === "stop"){ hfStop(); endSession("limit"); return; }
      if (res === "ok" || res === "ko") break;
    }
    if (!hfAlive(tok) || sess.cur !== id) continue;
    if (res !== "ok" && res !== "ko"){ res = "ko"; await sayWait(T("hfAssumeKo"), ui); }
    else await sayWait(T(res === "ok" ? "hfOk" : "hfKo"), ui);
    if (!hfAlive(tok) || sess.cur !== id) continue;

}

/* ---------- Phone voices: text-to-speech and dictation ---------- */
function plug(name){
  try {
    const C = window.Capacitor;
    if (!C || !C.isNativePlatform || !C.isNativePlatform()) return null;
    return (C.Plugins && C.Plugins[name]) || (C.registerPlugin && C.registerPlugin(name)) || null;
  } catch(e){ return null; }
}
const caps = {};
/* some Android versions never answer certain speech-service questions: give up after a short delay */
function withTimeout(p, ms, fallback){ return Promise.race([Promise.resolve(p).catch(() => fallback), new Promise(res => setTimeout(() => res(fallback), ms))]); }
function webVoices(){
  return new Promise(res => {
    try {
      const v = window.speechSynthesis ? speechSynthesis.getVoices() : [];
      if (v.length || !window.speechSynthesis) return res(v);
      const done = () => res(speechSynthesis.getVoices());
      speechSynthesis.onvoiceschanged = done; setTimeout(done, 1200);
    } catch(e){ res([]); }
  });
}
/* true = available, false = not available, null = cannot tell on this phone (to try) */
async function getCaps(code){
  if (caps[code]) return caps[code];
  if (capsPending[code]) return capsPending[code];
  return capsPending[code] = computeCaps(code);
}
const capsPending = {};
async function computeCaps(code){
  const r = {tts: null, stt: null};
  if (!langInfo(code)){ r.tts = false; r.stt = false; return caps[code] = r; }
  const P = plug("TextToSpeech"), R = plug("SpeechRecognition");
  if (P){ const x = await withTimeout(P.isLanguageSupported({lang: bcp(code)}), 2000, null); r.tts = x ? !!x.supported : null; }
  else { const v = await webVoices(); r.tts = window.speechSynthesis ? v.some(x => (x.lang || "").toLowerCase().replace("_", "-").startsWith(code)) : false; }
  if (R){
    try {
      const a = await withTimeout(R.available(), 2000, null);
      if (a && a.available === false) r.stt = false;
      else if (a){ const l = await withTimeout(R.getSupportedLanguages(), 2000, null); const arr = (l && l.languages) || []; r.stt = arr.length ? arr.some(x => String(x).toLowerCase().startsWith(code)) : null; }
    } catch(e){ r.stt = null; }
  } else r.stt = (window.SpeechRecognition || window.webkitSpeechRecognition) ? null : false;
  return caps[code] = r;
}
function stopSpeech(){ try { const P = plug("TextToSpeech"); if (P) P.stop(); else if (window.speechSynthesis) speechSynthesis.cancel(); } catch(e){} }
/* quiet = automatic playback during a review: no message when no voice is available (audio is optional) */
/* the voice for a language: the one chosen in Settings, otherwise the best one (Premium, Enhanced…), never a novelty voice */
const ODD_VOICES = /albert|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|deranged|hysterical|fred|junior|ralph|kathy|grandma|grandpa|rocko|shelley|flo|eddy|reed|sandy/i;
function voicesFor(code, all){ return (all || []).filter(x => (x.lang || "").toLowerCase().replace("_", "-").startsWith(code)); }
function pickVoice(code, all){
  const list = voicesFor(code, all); if (!list.length) return null;
  const want = S.voices && S.voices[code], chosen = want && list.find(x => x.voiceURI === want);
  if (chosen) return chosen;
  const score = x => (/premium/i.test(x.name) ? 4 : 0) + (/enhanced|amélior|erweitert|mejorad|miglior|melhorad/i.test(x.name) ? 3 : 0) + (x.default ? 1 : 0) + (x.localService ? 1 : 0) - (ODD_VOICES.test(x.name) ? 10 : 0);
  return list.slice().sort((a, b) => score(b) - score(a))[0];

const VOICE_SAMPLE = {fr: "Bonjour, je suis ta voix.", en: "Hello, I am your voice.", es: "Hola, soy tu voz.", de: "Hallo, ich bin deine Stimme.", it: "Ciao, sono la tua voce.", pt: "Olá, sou a tua voz.", ar: "مَرْحَبًا، أَنَا صَوْتُكَ.", tr: "Merhaba, ben senin sesinim.", eu: "Kaixo, zure ahotsa naiz.", nl: "Hallo, ik ben je stem.", ru: "Привет, я твой голос.", zh: "你好，我是你的声音。", ja: "こんにちは、あなたの声です。"};
function voiceCodes(){

async function speak(text, code, quiet){
  text = String(text || "").trim(); if (!text) return false;
  const c = await getCaps(code);
  if (c.tts === false){ if (!quiet) toast(T("noVoice", langName(code, null, false))); return false; }

    if (player) player.pause();

/* the learned language: my recording first, then the phone's voice */
async function playTarget(c, quiet){

  const tgt = S.settings.target;
  if (tgt && tgt.name && !tgt.subject) return quiet ? undefined : toast(T("noVoice", tgt.name));

async function dictate(inputId, code){
  const el = document.getElementById(inputId); if (!el) return;
  const name = langName(code, code === TK() && S.settings.target ? S.settings.target.name : null, false);
  const c = await getCaps(code);
  if (c.stt === false){ return toast(T("noDictation", name)); }
  const R = plug("SpeechRecognition");
  if (R){
    try {
      const p = R.checkPermissions ? await R.checkPermissions() : null;
      if (!p || p.speechRecognition !== "granted"){ const q = await R.requestPermissions(); if (q && q.speechRecognition && q.speechRecognition !== "granted") return toast(T("micDenied", APP)); }
      const res = await R.start({language: bcp(code), maxResults: 1, prompt: T("speakNow"), partialResults: false, popup: true});
      const m = res && res.matches && res.matches[0];
      if (m){ el.value = m; el.dispatchEvent(new Event("input")); } else toast(T("noDictation", name));
    } catch(e){ toast(T("noDictation", name)); }
    return;
  }
  const W = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!W) return toast(T("noDictation", name));
  try {
    const r = new W(); r.lang = bcp(code); r.maxAlternatives = 1;
    r.onresult = e => { el.value = e.results[0][0].transcript; };

}

}

function inSilence(t, st){
  const a = toMin(st.silenceStart), b = toMin(st.silenceEnd);
  if (isNaN(a) || isNaN(b)) return false;
  t = ((t % 1440) + 1440) % 1440;
  return a > b ? (t >= a || t < b) : (t >= a && t < b);
}
function slotProblem(a, b, st){
  const A = toMin(a), B = toMin(b);
  if (isNaN(A) || isNaN(B)) return T("incompleteTime");
  if (B - A < 5) return T("endAfterStart");
  if (inSilence(A, st) || inSilence(B - 1, st)) return T("overlapsSilence");
  return "";
}

/* column headers recognised in a pasted sheet: language names in the interface language, in French, in English and in the language itself */
function colmap(){
  const m = {};
  const names = code => { const out = [langName(code), (langInfo(code) || [])[1]]; for (const u of ["fr", "en"]){ try { out.push(new Intl.DisplayNames([u], {type:"language"}).of(code)); } catch(e){} } return out.filter(Boolean); };
  names(SK()).forEach(n => m[norm(n)] = "fr");
  if (S.settings.source && S.settings.source.name) m[norm(S.settings.source.name)] = "fr";
  names(TK()).forEach(n => m[norm(n)] = TK());
  if (S.settings.target && S.settings.target.name) m[norm(S.settings.target.name)] = TK();
  if (TK() === "eu") m.euskara = "eu";
  ["note","notes","nota","notiz","not","ملاحظة"].forEach(k => m[norm(k)] = "note");
  ["theme","thème","cours","topic","tema","thema","konu","موضوع",T("themeCol")].forEach(k => m[norm(k)] = "theme");
  m[norm(T("noteCol"))] = "note";
  return m;
}
function parseImport(text, defTheme){
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  if (!lines.length) return {cards:[], cols:[], missing:[], dups:[]};
  const delim = lines[0].includes("\t") ? "\t" : (lines[0].includes(";") ? ";" : ",");
  const CM = colmap(), head = lines[0].split(delim).map(h => CM[norm(h)] || null);
  const cols = [], names = {fr: SL(), note: T("noteCol"), theme: T("themeCol")}; LANGS.forEach(l => names[l.k] = l.name);
  head.forEach(h => { if (h && !cols.includes(names[h])) cols.push(names[h]); });
  const missing = ["fr", ...LANGS.map(l=>l.k)].filter(k => !head.includes(k)).map(k => names[k]);
  const seen = new Set(S.cards.map(c => norm(c.fr))), dups = [], cards = [];
  lines.slice(1).forEach((line, i) => {
    const cells = line.split(delim), get = k => { const j = head.indexOf(k); return j >= 0 ? (cells[j] || "").trim() : ""; };
    const fr = get("fr"); if (!fr) return;
    if (seen.has(norm(fr))) dups.push(fr); seen.add(norm(fr));
    const t = {}; LANGS.forEach(l => t[l.k] = get(l.k));
    cards.push({ id: uid(), fr, t, note: get("note"), theme: get("theme") || defTheme, created: Date.now() + i, intro: 0, s: {} });
  });
  return {cards, cols, missing, dups};
}

}

function dayRef(now, d){ const x = new Date(now); return new Date(x.getFullYear(), x.getMonth(), x.getDate() + d, 12).getTime(); }
async function doSchedule(){
  const LN = Native.LN, now = Date.now();
  if (!S.settings.target) return;
  const pend = await LN.getPending();
  if (pend && pend.notifications && pend.notifications.length) await LN.cancel({notifications: pend.notifications.map(n => ({id: n.id}))});
  /* sessions follow the priority course; the other courses are added at the end of the same notification */
  const list = withCourse(notifCourse(), () => {
  const intro = S.cards.filter(c => c.intro), stock = S.cards.filter(isNew).length;
  const list = [];
  for (let d = 0; d < 7; d++){
    const ref = d === 0 ? now : dayRef(now, d);
    const sessions = daySessions(ref), plan = d === 0 ? planToday(now) : null, doneL = d === 0 ? (dayLog(now).done || []) : [];
    let prev = -Infinity, first = true;
    sessions.forEach(s => {
      if (s.skipped || doneL.includes(s.startMin)) return;
      let rev, neu;
      if (plan){ const p = plan.find(r => r.startMin === s.startMin) || {}; rev = p.rev || 0; neu = p.neu || 0; }
      else { rev = intro.filter(c => { const m = minDue(c); return m <= s.start && m > prev; }).length; neu = first ? Math.min(stock, Math.max(1, newLeftToday(now))) : 0; }
      prev = s.start; first = false;
      if (s.start <= now + 30e3) return;
      if (rev + neu === 0) return;
      const others = (S.courses || []).filter(c => c.id !== S.active).map(c => { const w = courseWork(c.id, s.start); return {c, n: w.due + (d === 0 ? w.neu : 0)}; }).filter(x => x.n);
      /* only the priority language triggers a notification; the others ride along in the same message */
      if (rev + neu === 0) return;
      const oth = others.map(x => courseName(x.c) + " " + x.n).join(", ");
      list.push({ id: d * 2000 + s.startMin, title: T("sessionAt", fmtMin(s.at)),
        body: countsText(rev, neu, false) + (oth ? " · + " + oth : "") + ". " + T("available"),
        schedule: {at: new Date(s.start), allowWhileIdle: true}, actionTypeId: "SESSION", channelId: "seances",
        extra: {kind: "session", day: dayKey(s.start), startMin: s.startMin} });
    });
  }
  for (let i = 0, t = now; i < 3; i++){
    const nc = nextCourse(t); if (!nc) break;
    let at = nc.at; const m = new Date(at).getHours() * 60 + new Date(at).getMinutes();
    if (inSilence(m, S.settings)){ const e = toMin(S.settings.silenceEnd); at = midnight(at) + (e > m ? 0 : D) + e * M; }
    list.push({ id: 19000 + i, title: T("courseTitle", dayName(nc.d, true)), body: T("courseBody"),
      schedule: {at: new Date(at), allowWhileIdle: true}, actionTypeId: "COURSE", channelId: "seances", extra: {kind: "course"} });
    t = nc.at + M;
  }
  return list;
  });
  EXT.notifs.forEach(f => { try { list.push(...f(now, list.slice())); } catch(e){} });
  if (list.length) await LN.schedule({notifications: list});
}
function onNotifAction(ev){
  const x = (ev && ev.notification && ev.notification.extra) || {}, act = ev && ev.actionId;
  if (view === "session" && sess && !sess.ended) return;
  if (EXT.actions[x.kind]) return EXT.actions[x.kind](act, x);
  if (x.kind === "course"){ addTab = "express"; return go("add"); }
  if (x.kind === "pause"){ pauseUntil = 0; return openPrep(false, true); }
  if (x.kind !== "session") return go("home");
  const now = Date.now(), key = dayKey(now);
  if (S.primary && S.primary !== S.active) switchCourse(S.primary);
  /* "in 15 min" / "in 1 hour": postpone and go straight back to what I was doing (Android opens the app for any button) */
  if ((act === "s15" || act === "s60") && x.day === key){
    const d = act === "s15" ? 15 : 60, nowMin = new Date(now).getHours() * 60 + new Date(now).getMinutes();
    const sh = S.settings.shift[key] || (S.settings.shift[key] = {});
    sh[x.startMin] = nowMin + d - x.startMin; save(); go("home");
    toast(T("postponedTo", fmtMin(nowMin + d)));
    return backToPhone();
  }
  if (act === "s15" || act === "s60") return backToPhone();
  if (act === "later" && x.day === key){ snoozeFor = {day: x.day, startMin: x.startMin}; return go("snooze"); }
  if (act === "later") return go("home");
  if (S.primary && S.primary !== S.active) switchCourse(S.primary);
  openPrep(false, true);
}

/* ---------- Several courses: one language pair each (my language → a language I learn) ----------
   The active course is mirrored into S.cards / S.log / S.settings[PER] so the rest of the app works unchanged. */
/* the shared build is set to one language only (MULTI = false) */
const MULTI = false;
const PER = ["source", "target", "newPerDay", "reviewCap", "courseDays", "revDir", "revAsk", "revAns", "grp"];
let addingCourse = false, delCourseAsk = null, reuse = {from: "", theme: "", picked: null}, xp = {langs: null, extra: [], theme: "", onlyTodo: false, chunk: 0, text: ""}, multiPreview = null, listTodo = false;

function activeCourse(){ return (S.courses || []).find(c => c.id === S.active) || null; }
function courseById(id){ return (S.courses || []).find(c => c.id === id) || null; }
function stashActive(){
  const c = activeCourse(); if (!c) return;
  c.cards = S.cards; c.log = S.log; c.dismissedCourse = S.dismissedCourse;
  c.set = {}; PER.forEach(k => { if (S.settings[k] !== undefined) c.set[k] = S.settings[k]; });
}
function loadCourse(c){
  const def = defaultSettings();
  S.cards = c.cards || (c.cards = []); S.log = c.log || (c.log = {}); S.dismissedCourse = c.dismissedCourse;
  PER.forEach(k => { S.settings[k] = c.set && c.set[k] !== undefined ? c.set[k] : (k === "courseDays" ? {} : def[k]); });
  setLang();
}
function switchCourse(id){
  if (id === S.active) return;
  const c = courseById(id); if (!c) return;
  stashActive(); S.active = id; loadCourse(c);
}
/* run fn with another course loaded, then come back (no save in between) */
function withCourse(id, fn){
  if (!id || id === S.active || !courseById(id)) return fn();
  const prev = S.active; stashActive(); S.active = id; loadCourse(courseById(id));
  try { return fn(); } finally { stashActive(); S.active = prev; loadCourse(courseById(prev)); }
}
/* first run of this version: the existing cards become the first course */
function ensureCourses(){
  if (!S.courses) S.courses = [];
  if (!S.courses.length && S.settings.target && S.settings.source){
    const c = {id: uid(), cards: S.cards, log: S.log, dismissedCourse: S.dismissedCourse, set: {}};
    S.courses.push(c); S.active = c.id; stashActive();
  }
  if (S.courses.length && !courseById(S.active)) S.active = S.courses[0].id;
  if (S.courses.length && !courseById(S.primary)) S.primary = S.courses[0].id;
  /* languages added before this option existed follow my new words too */
  S.courses.forEach(c => { if (c.autoSync === undefined && c.id !== S.primary) c.autoSync = true; });
}
function serialize(){
  stashActive();
  const multi = S.courses && S.courses.length;
  return JSON.stringify(S, function(k, v){ return multi && this === S && (k === "cards" || k === "log" || k === "dismissedCourse") ? undefined : v; });
}
/* load a saved state (local storage or a backup), old or new format */
function adopt(d){
  S = d;
  if (S.courses && S.courses.length){
    const c = courseById(S.active) || S.courses[0]; S.active = c.id;
    S.settings = S.settings || defaultSettings(); S.cards = c.cards || []; S.log = c.log || {};
    PER.forEach(k => { if (c.set && c.set[k] !== undefined) S.settings[k] = c.set[k]; });
  }
  if (!Array.isArray(S.cards)) S.cards = [];
  migrate(); ensureCourses();
  const c = activeCourse(); if (c) loadCourse(c);
}
function courseName(c){ const t = c && c.set && c.set.target; return t ? langName(t.code, t.name) : "?"; }
function courseOf(src, tgt){ return (S.courses || []).find(c => c.set && c.set.source && c.set.target && c.set.source.code === src && c.set.target.code === tgt); }
function newCourse(src, tgt){
  stashActive();
  const keep = {revDir: S.settings.revDir, revAsk: S.settings.revAsk, revAns: S.settings.revAns};
  const c = {id: uid(), cards: [], log: {}, set: Object.assign({source: src, target: tgt, newPerDay: 10, reviewCap: 100, courseDays: {}}, keep)};
  S.courses.push(c); S.active = c.id; loadCourse(c);

}
/* what a course has to do now: due cards and new cards still allowed today */
function courseWork(id, at){
  if (cStatus(courseById(id)) === "pause") return {due: 0, neu: 0, n: 0};
  return withCourse(id, () => {
    const now = Date.now(), t = at || now;
    const due = S.cards.filter(c => LANGS.some(l => c.s[l.k] && c.s[l.k].due <= t)).length;
    const neu = Math.min(S.cards.filter(isNew).length, newLeftToday(now));
    return {due, neu, n: due + neu};
  });
}
function otherWork(exclude){

}

/* ---------- Images shared between courses ---------- */
function imgK(c){ return c.imgId || c.id; }
function allCards(){ stashActive(); return (S.courses || []).flatMap(c => c.cards || []); }
function imgUsed(key, except){ return allCards().some(c => c !== except && c.img && imgK(c) === key); }
function dropImg(c){ const k = imgK(c); if (c.img && !imgUsed(k, c)) idbDel(k).catch(() => {}); delete imgURL[k]; }

function twinOf(text){

  return allCards().find(c => c.img && norm(c.fr) === n && !S.cards.includes(c) && (courseOfCard(c) || {}).set?.source?.code === SK()) || null;
}
function courseOfCard(card){ return (S.courses || []).find(c => (c.id === S.active ? S.cards : c.cards || []).includes(card)); }

/* suggestions of words already typed in my other courses */
function srcSuggestions(){

  (S.courses || []).filter(c => c.id !== S.active && !(c.set.target && c.set.target.subject) && c.set.source && c.set.source.code === SK()).forEach(c => (c.cards || []).forEach(x => {

  const pick = starts.concat(inside).filter(x => norm(x) !== q).slice(0, 3);

}

/* ---------- Import a table: completes existing cards in every course, no duplicates ---------- */
function headerCode(h){
  const n = norm(h).replace(/[*_`]/g, "").trim(); if (!n) return null;
  if (["note","notes","nota","notiz","not","ملاحظة", norm(T("noteCol"))].includes(n)) return "note";
  if (isSubj() && ["question","questions","recto","pregunta","frage","domanda","pergunta","soru","سؤال", norm(T("qCol"))].map(norm).includes(n)) return SK();
  if (isSubj() && ["reponse","réponse","reponses","answer","verso","respuesta","antwort","risposta","resposta","cevap","جواب", norm(T("aCol"))].map(norm).includes(n)) return TK();
  if (["pieges","pièges","piege","distracteurs","mauvaises reponses","wrong answers","traps"].map(norm).includes(n)) return "bad";
  if (["theme","thème","chapitre","cours","topic","tema","thema","konu","موضوع", norm(T("themeCol"))].map(norm).includes(n)) return "theme";
  for (const c of S.courses || []){ for (const l of [c.set.source, c.set.target]) if (l && l.name && norm(l.name) === n) return l.code; }
  for (const [k, endo] of LANGS_ALL){
    const names = [k, endo, langName(k)]; for (const u of ["fr", "en"]){ try { names.push(new Intl.DisplayNames([u], {type: "language"}).of(k)); } catch(e){} }
    if (names.filter(Boolean).some(x => norm(x) === n)) return k;
  }
  if (n === "basque" || n === "euskara") return "eu";
  return null;
}
function splitTable(text){
  const lines = text.split(/\r?\n/).map(l => l.replace(/ /g, " ")).filter(l => l.trim() && !/^\s*```/.test(l) && !/^\s*\|?\s*:?-{3,}/.test(l));
  if (!lines.length) return [];
  const pipe = lines[0].includes("|") && !lines[0].includes("\t");
  const delim = pipe ? "|" : lines[0].includes("\t") ? "\t" : lines[0].includes(";") ? ";" : ",";
  return lines.map(l => { let cells = l.split(delim).map(x => x.trim()); if (pipe){ if (cells[0] === "") cells.shift(); if (cells[cells.length - 1] === "") cells.pop(); } return cells; });
}
function planImport(text, defTheme, overwrite){
  const rows = splitTable(text); if (rows.length < 2) return {error: T("needHeader")};
  const head = rows[0].map(headerCode), si = head.indexOf(SK());
  if (si < 0) return {error: T("needSrcCol", SL())};
  const langs = [...new Set(head.filter(k => k && k !== "note" && k !== "theme" && k !== "bad" && k !== SK()))];
  if (!MULTI) langs.splice(0, langs.length, ...langs.filter(k => k === TK()));
  const per = {}; langs.forEach(k => per[k] = {k, course: courseOf(SK(), k), fill: 0, add: 0, change: 0, keep: 0, same: 0});
  if (!per[TK()]) per[TK()] = {k: TK(), course: activeCourse(), fill: 0, add: 0, change: 0, keep: 0, same: 0, noCol: true};
  stashActive();
  const idx = k => head.indexOf(k);
  const data = rows.slice(1).map(r => ({fr: (r[si] || "").trim(), note: idx("note") >= 0 ? (r[idx("note")] || "").trim() : "", theme: (idx("theme") >= 0 ? (r[idx("theme")] || "").trim() : "") || defTheme, bad: idx("bad") >= 0 ? (r[idx("bad")] || "").split(/\s*[;|]\s*|\s+\/\s+/).map(x => x.trim()).filter(Boolean) : [], v: Object.fromEntries(langs.map(k => [k, (r[idx(k)] || "").trim()]))})).filter(r => r.fr);
  Object.values(per).forEach(p => {
    const cards = p.course ? (p.course.cards || []) : [], by = new Map(cards.map(c => [norm(c.fr), c])), seen = new Set();
    data.forEach(r => {
      const n = norm(r.fr); if (seen.has(n)) return; seen.add(n);
      const v = r.v[p.k] || "", c = by.get(n);
      if (c){ const old = (c.t[p.k] || "").trim(); if (!v) return; if (!old) p.fill++; else if (old === v) p.same++; else if (overwrite) p.change++; else p.keep++; }
      else if (v || p.k === TK()) p.add++;
    });
  });
  return {data, per: Object.values(per), overwrite};
}
function runImport(plan, createNew){
  stashActive(); const now = Date.now(); let total = 0; const made = [];
  plan.per.forEach(p => {
    let course = p.course;
    if (!course){ if (!createNew.includes(p.k)) return; const back = S.active; course = newCourse(S.settings.source, {code: p.k}); switchCourse(back); p.course = course; }
    const cards = course.id === S.active ? S.cards : (course.cards || (course.cards = [])), by = new Map(cards.map(c => [norm(c.fr), c])), seen = new Set();
    plan.data.forEach((r, i) => {
      const n = norm(r.fr); if (seen.has(n)) return; seen.add(n);
      const v = r.v[p.k] || "", c = by.get(n);
      if (c){
        const old = (c.t[p.k] || "").trim(); if (!v || old === v || (old && !plan.overwrite)) return;
        c.t[p.k] = v; if (c.intro && !c.s[p.k]) c.s[p.k] = {p: 0, due: now}; total++;
      } else if (v || p.k === TK()){
        const nc = {id: uid(), fr: r.fr, t: v ? {[p.k]: v} : {}, note: r.note, theme: r.theme, created: now + i, intro: 0, s: {}};
        if (r.bad && r.bad.length) nc.bad = r.bad;
        const tw = allCards().find(x => x.img && norm(x.fr) === n); if (tw){ nc.img = true; nc.imgId = imgK(tw); }
        cards.push(nc); by.set(n, nc); total++; if (course.id === S.active) made.push(nc);
      }
    });
  });
  loadCourse(activeCourse()); propagate(made);
  return total;
}

/* ---------- Automatic copies: a new language gets all my words; later words follow ---------- */
function srcWordsFor(courseId, srcCode){
  stashActive();
  const target = courseById(courseId), have = new Set((target && target.cards || []).map(c => norm(c.fr))), out = [];
  if (target && target.set.target && target.set.target.subject) return out;
  (S.courses || []).filter(c => c.id !== courseId && !(c.set.target && c.set.target.subject) && c.set.source && c.set.source.code === srcCode).forEach(c => (c.cards || []).forEach(x => {
    const n = norm(x.fr); if (!n || have.has(n)) return; have.add(n); out.push(x);
  }));
  return out;
}
function copyIntoThenTranslate(course, words){ const n = copyInto(course, words); setTimeout(autoTranslate, 300); return n; }
function copyInto(course, words){
  const now = Date.now();
  words.forEach((x, i) => course.cards.push({id: uid(), fr: x.fr, t: {}, note: "", theme: x.theme || "", created: now + i, intro: 0, s: {}, img: !!x.img, imgId: x.img ? imgK(x) : undefined}));
  return words.length;
}
/* new cards typed in one language are added, to complete, to the languages set to follow */
function propagate(newCards){
  stashActive();
  if (isSubj()) return;
  (S.courses || []).filter(c => c.id !== S.active && c.autoSync && !(c.set.target && c.set.target.subject) && c.set.source && c.set.source.code === SK()).forEach(c => {
    const have = new Set((c.cards || []).map(x => norm(x.fr)));
    copyInto(c, newCards.filter(x => { const n = norm(x.fr); if (!n || have.has(n)) return false; have.add(n); return true; }));
  });
}

/* ---------- Automatic translation on the phone (Google ML Kit, offline, free) ----------
   Arabic is left out by default: ML Kit writes it without vowels; the export to a free AI is used instead. */
const MLKIT = "af ar be bg bn ca cs cy da de el en eo es et fa fi fr ga gl gu he hi hr ht hu id is it ja ka kn ko lt lv mk mr ms mt nl no pl pt ro ru sk sl sq sv sw ta te th tl tr uk ur vi zh".split(" ");
let mtBusy = false;
function mtPlugin(){ return plug("Translation") || (Native ? null : {translate: webTranslate}); }
/* on a computer: any real language pair (the browser's own translator, or the free online service for adults) */
function mtPossible(src, tgt){ if (!Native) return src !== tgt && !!langInfo(src) && !!langInfo(tgt); return MLKIT.includes(src) && MLKIT.includes(tgt) && src !== tgt; }
function mtOn(c){ return !!(c && c.set.source && c.set.target && mtPossible(c.set.source.code, c.set.target.code) && (c.autoTr !== undefined ? c.autoTr : c.set.target.code !== "ar")); }
function mtLine(src, tgt){
  if (!mtPossible(src, tgt)) return T("mtNo", langName(tgt, null, false));
  if (tgt === "ar") return T("mtArabic");
  return Native ? T("mtYes") : T("mtYesWeb");
}
function mtToggle(c){
  if (!mtPossible(c.set.source.code, c.set.target.code)) return `<p class="muted small">${T("mtNo", courseName(c))}</p>`;
  return `<label class="toggle" style="width:100%"><input type="checkbox" data-mt="${c.id}" ${mtOn(c) ? "checked" : ""}><span class="small">${T("mtLbl")}${c.set.target.code === "ar" ? " · " + T("mtArabicShort") : ""}</span></label>`;
}
/* ML Kit goes through English between two other languages (French → English → Spanish), which spoils verbs.
   Between two non-English languages, translate directly with MyMemory (free, online); ML Kit stays the fallback. */
let mmBlockedDay = null;
function decodeHtml(t){ const d = document.createElement("textarea"); d.innerHTML = t; return d.value; }
/* direct translation needed (no English on either side)? */
const needsDirect = (src, tgt) => src !== "en" && tgt !== "en";
/* why the direct translation cannot be used right now: "offline", "quota" or null */
function directBlocked(){ return !navigator.onLine ? "offline" : mmBlockedDay === dayKey(Date.now()) ? "quota" : null; }
/* the user agreed, for today, to translate through English while the direct one is unavailable */
const pivotOk = () => S.mtPivotDay === dayKey(Date.now());
let mtWaiting = null;   /* {reason, n}: words waiting for a better translation, shown as a question */
async function directTranslate(text, src, tgt){
  if (!needsDirect(src, tgt)) return null;
  return mmTranslate(text, src, tgt);
}
async function mmTranslate(text, src, tgt){
  if (isMinor() || directBlocked() || new Blob([text]).size > 480) return null;
  try {
    const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 9000);
    const r = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(text) + "&langpair=" + src + "|" + tgt, {signal: ctl.signal});
    clearTimeout(tm);
    const j = await r.json();
    const out = j && j.responseData && j.responseData.translatedText;
    if (j.quotaFinished || /MYMEMORY WARNING|QUERY LENGTH LIMIT|INVALID/i.test(out || "") || +j.responseStatus === 429){ mmBlockedDay = dayKey(Date.now()); return null; }
    if (+j.responseStatus !== 200 || !out || !out.trim()) return null;
    return {text: decodeHtml(out).trim(), via: "mm"};
  } catch(e){ if (!navigator.onLine) return null; mmFails = (mmFails || 0) + 1; if (mmFails >= 3) mmBlockedDay = dayKey(Date.now()); return null; }
}
let mmFails = 0;
const dlToasted = new Set();
async function translateText(P, text, src, tgt, onPhone){
  if (!Native) return await webTranslate({text, sourceLanguage: src, targetLanguage: tgt});
  const d = await directTranslate(text, src, tgt); if (d){ mmFails = 0; return d; }
  /* no direct translation: going through English is less reliable, so ask first */
  /* under 15: no online service at all, the phone translates (through English) without asking */
  if (needsDirect(src, tgt) && !pivotOk() && !isMinor()) return {blocked: directBlocked() || "offline"};
  if (onPhone) onPhone();
  return await withTimeout(P.translate({text, sourceLanguage: src, targetLanguage: tgt}), 120000, null);
}
/* ---------- On a computer: Chrome and Edge translate on the computer itself (nothing is sent);
   other browsers, or a pair they do not know, use the free online service, never for under-15s ---------- */
const webTr = {}; let webNeedDl = null;
async function webTranslate({text, sourceLanguage: s, targetLanguage: t}){
  if ("Translator" in self){
    const key = s + ">" + t, opts = {sourceLanguage: s, targetLanguage: t};
    try {
      if (!webTr[key]){
        const av = await Translator.availability(opts);
        if (av === "unavailable") webTr[key] = "none";
        else { try { webTr[key] = await Translator.create(opts); } catch(e){ webNeedDl = opts; if (view === "home") render(); return null; } }
      }
      if (webTr[key] !== "none"){ const out = await webTr[key].translate(text); if (out && out.trim()) return {text: out.trim()}; }
    } catch(e){}
  }
  return await mmTranslate(text, s, t);
}
/* the translator must be downloaded once, and the browser wants a tap for that */
function webDlBanner(){
  if (!webNeedDl) return "";
  return `<div class="banner stack"><strong>🌐 ${T("webDlTitle")}</strong><p class="small" style="margin:0">${T("webDlHelp")}</p>
    <button class="btn block" data-act="webDl">${T("webDlBtn")}</button></div>`;
}
async function webDownload(){
  const opts = webNeedDl; if (!opts) return;
  toast(T("webDlBusy"));
  try {
    webTr[opts.sourceLanguage + ">" + opts.targetLanguage] = await Translator.create(Object.assign({}, opts, {monitor(m){ m.addEventListener("downloadprogress", e => { if (e.loaded >= 1) toast(T("webDlReady")); }); }}));
    webNeedDl = null; render(); setTimeout(autoTranslate, 300);
  } catch(e){ webNeedDl = null; render(); toast(T("webDlFail")); }
}
function mtWaitBanner(){
  if (!mtWaiting || S.mtWaitDay === dayKey(Date.now())) return "";
  return `<div class="banner stack"><strong>${T(mtWaiting.reason === "quota" ? "mtQuotaTitle" : "mtOfflineTitle")}</strong>
    <p class="small" style="margin:0">${T("mtWaitWhy", mtWaiting.n)}</p>

}
window.addEventListener("online", () => { mmFails = 0; setTimeout(autoTranslate, 1500); });
/* translate again the automatic translations not checked yet (made before, through English) */
function retranslateMt(){
  const k = TK(); let n = 0;
  S.cards.forEach(c => { if (c.mt){ c.t[k] = ""; delete c.mt; delete c.numTried; n++; } });
  save(); setTimeout(autoTranslate, 200);
  return n;

/* fills the cards waiting "to complete" in every course where it is switched on; marks them "auto" to check */
async function autoTranslate(){
  const P = mtPlugin(); if (!P || mtBusy || !S.courses) return;
  mtBusy = true; let done = 0, waiting = 0, why = null;
  try {
    stashActive();
    for (const c of S.courses){
      if (!mtOn(c)) continue;
      const src = c.set.source.code, tgt = c.set.target.code;
      /* numbers typed as digits were copied as digits: translate them again, written in words */
      (c.cards || []).forEach(x => { const v = (x.t[tgt] || "").trim(); if (v && !x.numTried && numWords(x.fr) && (x.mt || v === (x.fr || "").trim())){ x.t[tgt] = ""; delete x.mt; } });
      const todo = (c.cards || []).filter(x => !(x.t[tgt] || "").trim() && (x.fr || "").trim());
      if (!todo.length) continue;
      const onPhone = () => { if (!c.mtModel && !dlToasted.has(c.id)){ dlToasted.add(c.id); toast(T("mtDownloading", courseName(c))); } };
      for (const x of todo){
        try {
          const words = numWords(x.fr); if (words) x.numTried = true;
          const r = words ? (tgt === "en" ? {text: words} : await translateText(P, words, "en", tgt, onPhone)) : await translateText(P, x.fr, src, tgt, onPhone);
          if (r && r.blocked){ why = r.blocked; waiting += todo.filter(y => !(y.t[tgt] || "").trim()).length; break; }
          if (r && r.text && !(x.t[tgt] || "").trim()){ x.t[tgt] = r.text.trim(); x.mt = true; if (x.intro && !x.s[tgt]) x.s[tgt] = {p: 0, due: Date.now()}; done++; c.mtModel = true; }
          else if (!r) break;
        } catch(e){ break; }
        if (done && done % 20 === 0) save();
      }
    }
  } finally {
    mtBusy = false;
    const before = mtWaiting && mtWaiting.n;
    mtWaiting = waiting ? {reason: why, n: waiting} : null;
    if (done){ save(); toast(T("mtDone", done)); }
    if ((done || before !== (mtWaiting && mtWaiting.n)) && (view === "home" || view === "list")) render();
  }
}

/* ---------- One word, one spelling: correcting my language on a card corrects it in every language ----------
   An automatic translation made from the old text is redone; a translation typed by hand is kept. */
function fixSourceEverywhere(card, oldText, newText){
  if (!oldText || norm(oldText) === norm(newText)) return [];
  stashActive();
  const src = SK(), changed = [];
  (S.courses || []).forEach(c => {
    if (!c.set.source || c.set.source.code !== src) return;
    (c.cards || []).forEach(x => {
      if (x === card || norm(x.fr) !== norm(oldText)) return;
      x.fr = newText;
      const k = c.set.target.code;
      if (x.mt){ x.t[k] = ""; delete x.mt; }
      if (!changed.includes(c)) changed.push(c);
    });
  });

/* numbers written in figures ("20", "100%") become words before translation, so the other language gets them in letters */
function frWords(n){
  const U = ["zéro","un","deux","trois","quatre","cinq","six","sept","huit","neuf","dix","onze","douze","treize","quatorze","quinze","seize"];
  const T10 = {20: "vingt", 30: "trente", 40: "quarante", 50: "cinquante", 60: "soixante"};
  const under100 = x => {
    if (x <= 16) return U[x];
    if (x < 20) return "dix-" + U[x - 10];
    if (x < 70){ const t = Math.floor(x / 10) * 10, u = x % 10; return T10[t] + (u === 0 ? "" : u === 1 ? " et un" : "-" + U[u]); }
    if (x < 80) return x === 71 ? "soixante et onze" : "soixante-" + under100(x - 60);
    if (x === 80) return "quatre-vingts";
    return "quatre-vingt-" + under100(x - 80);
  };
  const under1000 = x => {
    const h = Math.floor(x / 100), r = x % 100;
    if (!h) return under100(r);
    const head = h === 1 ? "cent" : U[h] + (r === 0 ? " cents" : " cent");
    return r ? head + " " + under100(r) : head;
  };
  if (n < 1000) return under1000(n);
  const th = Math.floor(n / 1000), r = n % 1000;
  return (th === 1 ? "mille" : under1000(th).replace(/cents$/, "cent") + " mille") + (r ? " " + under1000(r) : "");
}
function enWords(n){
  const U = ["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
  const T = ["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
  const u100 = x => x < 20 ? U[x] : T[Math.floor(x / 10)] + (x % 10 ? "-" + U[x % 10] : "");
  const u1000 = x => { const h = Math.floor(x / 100), r = x % 100; return (h ? U[h] + " hundred" + (r ? " and " : "") : "") + (r || !h ? u100(r) : ""); };
  if (n < 1000) return u1000(n);
  const th = Math.floor(n / 1000), r = n % 1000;
  return u1000(th) + " thousand" + (r ? (r < 100 ? " and " : " ") + u1000(r) : "");
}
/* a number typed in figures, whatever my language: written in English words first, then translated from English.
   A number has only one meaning, so going through English adds no mistake.
   Accepted: 0-9 as in France, Arabic-Indic digits (٠١٢…) and Persian ones (۰۱۲…), percentages, ordinals (1er, 2e, 3rd, 4., 5º…). */
function enOrdinal(n){
  const special = {1: "first", 2: "second", 3: "third", 5: "fifth", 8: "eighth", 9: "ninth", 12: "twelfth"};
  if (special[n]) return special[n];
  const w = enWords(n);
  if (n % 100 < 20 && special[n % 100] && n > 20) return w.replace(/[a-z]+$/, special[n % 100]);
  if (n > 20 && n % 10 && special[n % 10] && !(n % 100 >= 10 && n % 100 < 20)) return w.replace(/[a-z]+$/, special[n % 10]);
  if (/y$/.test(w)) return w.replace(/y$/, "ieth");
